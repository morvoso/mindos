# makepkg settings for the MindOS build box (shared with the host through /work)
MAKEFLAGS="-j$(nproc)"
BUILDDIR=/work/build/makepkg
SRCDEST=/work/build/sources
PKGDEST=/work/build/packages
LOGDEST=/work/build/logs
SRCPKGDEST=/work/build/srcpackages
PACKAGER="MindOS Build <build@mindos.local>"
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug !lto)
COMPRESSZST=(zstd -c -T0 -19 -)
