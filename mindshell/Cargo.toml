[package]
name = "mindshell"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The MindOS desktop shell: layer-shell panels, launcher, tray and desktop widgets rendered with WebKitGTK"
publish = false

[dependencies]
gtk4 = { version = "0.11", features = ["v4_16"] }
webkit6 = { version = "0.6", features = ["v2_44"] }
gtk4-layer-shell = "0.8"
system-tray = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
freedesktop-icons = "0.4"
png = "0.18"
async-channel = "2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1
