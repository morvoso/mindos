# MindOS defaults for foot (/etc/mindos/xdg/foot/foot.ini, found via XDG_CONFIG_DIRS;
# users override with ~/.config/foot/foot.ini)
[main]
font=JetBrains Mono:size=11
pad=8x8
term=foot

[scrollback]
lines=10000

# mindwm draws no decorations and neither should the terminal
[csd]
preferred=none

# foot >= 1.28 uses [colors-dark]/[colors-light] instead of [colors]
[colors-dark]
alpha=1.0
background=161616
foreground=e6e6e6
regular0=1a1a1a
regular1=c0392b
regular2=27ae60
regular3=f39c12
regular4=2980b9
regular5=8e44ad
regular6=16a085
regular7=bfbfbf
bright0=555555
bright1=e74c3c
bright2=2ecc71
bright3=f1c40f
bright4=3498db
bright5=9b59b6
bright6=1abc9c
bright7=ffffff
