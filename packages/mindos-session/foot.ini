# MindOS defaults for foot (/etc/mindos/xdg/foot/foot.ini, found via XDG_CONFIG_DIRS;
# users override with ~/.config/foot/foot.ini)
[main]
font=JetBrains Mono:size=11
pad=12x10
term=foot

[scrollback]
lines=10000

# mindwm draws the title bar (server-side decorations); foot must not add its own
[csd]
preferred=server

# foot >= 1.28 uses [colors-dark]/[colors-light] instead of [colors].
# The MindOS palette: a slightly translucent void, the cyan accent for
# selection and the cursor, no pure red (danger is pink).
[colors-dark]
alpha=0.92
background=0a0d12
foreground=e6edf3
selection-background=1c5a66
selection-foreground=e6edf3
regular0=161d26
regular1=ff5d8f
regular2=3ddc97
regular3=ffb454
regular4=5aa7ff
regular5=a78bfa
regular6=19e3ff
regular7=8b9bb0
bright0=2f4257
bright1=ff8ab0
bright2=6ff0b8
bright3=ffca7a
bright4=8ec5ff
bright5=c4b1ff
bright6=7ff0ff
bright7=e6edf3
# text and cursor colours (foot >= 1.28 keeps this in the colour sections)
cursor=0a0d12 19e3ff
