# MindOS defaults for GTK applications. Installed as
# /etc/mindos/xdg/gtk-3.0/settings.ini and /etc/mindos/xdg/gtk-4.0/settings.ini,
# found through XDG_CONFIG_DIRS (see /usr/bin/mindos-session); a user's own
# ~/.config/gtk-3.0/settings.ini still wins, as does the settings portal when
# xdg-desktop-portal-gtk is running.
#
# Dark everywhere: the dark variant of the built-in theme (Adwaita-dark is an
# alias of it in GTK 4). GTK 4 and libadwaita apps also take the colour scheme
# from the settings portal, which reads org.gnome.desktop.interface
# color-scheme (defaulted to prefer-dark by 90_mindos.gschema.override).
#
# GTK does not read font rendering out of fontconfig, so the values here mirror
# /etc/fonts/conf.d/49-mindos-rendering.conf: grayscale antialiasing (no
# subpixel/LCD filtering) and slight hinting.
[Settings]
gtk-theme-name=Adwaita-dark
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=breeze-dark
gtk-cursor-theme-name=Adwaita
# Client-side title bars (GTK cannot ask mindwm for one) get all three buttons.
gtk-decoration-layout=:minimize,maximize,close
gtk-font-name=Inter 11
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=none
