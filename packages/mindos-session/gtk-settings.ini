# MindOS defaults for GTK applications. Installed as
# /etc/mindos/xdg/gtk-3.0/settings.ini and /etc/mindos/xdg/gtk-4.0/settings.ini,
# found through XDG_CONFIG_DIRS (see /usr/bin/mindos-session); a user's own
# ~/.config/gtk-3.0/settings.ini still wins, as does the settings portal when
# xdg-desktop-portal-gtk is running.
#
# GTK does not read font rendering out of fontconfig, so the values here mirror
# /etc/fonts/conf.d/49-mindos-rendering.conf: grayscale antialiasing (no
# subpixel/LCD filtering) and slight hinting.
[Settings]
gtk-font-name=Inter 11
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=none
