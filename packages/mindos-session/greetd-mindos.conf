# MindOS: use /etc/mindos/greetd.toml instead of /etc/greetd/config.toml, and
# hand the screen from the Plymouth splash to the compositor without a red flash.
#
# Upstream greetd.service is ordered After=plymouth-quit-wait.service, so
# Plymouth restores the red text VT before the session starts. Instead:
#   1. conflict with the plymouth quit units and start right after the splash;
#   2. `plymouth deactivate` drops DRM master (the splash stays on screen) so
#      the compositor can take the display without racing plymouthd;
#   3. greetd-vt makes tty1 dark, because greetd resets its VT to text mode and
#      clears it before every session (that cleared console is what is visible
#      until mindwm draws its first frame);
#   4. once greetd is up, quit Plymouth with --retain-splash.
# If greetd fails, plymouth-quit.service runs so the text greeter is reachable.
[Unit]
Conflicts=plymouth-quit.service plymouth-quit-wait.service
After=plymouth-start.service
OnFailure=plymouth-quit.service

[Service]
ExecStartPre=-/usr/bin/plymouth deactivate
ExecStartPre=-/usr/lib/mindos/greetd-vt
ExecStart=
ExecStart=/usr/bin/greetd --config /etc/mindos/greetd.toml
ExecStartPost=-/usr/bin/plymouth quit --retain-splash
