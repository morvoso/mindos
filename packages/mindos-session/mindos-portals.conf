# xdg-desktop-portal configuration for the MindOS session
# (/usr/share/xdg-desktop-portal/mindos-portals.conf, picked because
# XDG_CURRENT_DESKTOP=MindOS). The GTK backend provides the file chooser and
# the Settings portal, which is how Firefox, GTK 4 and libadwaita apps learn
# that the desktop prefers a dark colour scheme.
[preferred]
default=gtk
