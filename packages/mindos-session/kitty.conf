# MindOS system defaults. Kitty merges this before ~/.config/kitty/kitty.conf.
# https://sw.kovidgoyal.net/kitty/invocation/#cmdoption-kitty-config
font_family JetBrains Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0
disable_ligatures always

background #0d1016
foreground #edf2f8
background_opacity 0.97
selection_background #67dce5
selection_foreground #080a0e
cursor #67dce5
cursor_text_color #080a0e
cursor_shape beam
cursor_blink_interval 0
url_color #67dce5

window_padding_width 14
window_border_width 1
active_border_color #67dce5
inactive_border_color #2a3442
hide_window_decorations no
remember_window_size yes
initial_window_width 100c
initial_window_height 30c

tab_bar_style separator
tab_bar_edge top
tab_bar_min_tabs 2
tab_separator "   "
tab_bar_background #0d1016
active_tab_background #1b202a
active_tab_foreground #67dce5
active_tab_font_style bold
inactive_tab_background #0d1016
inactive_tab_foreground #adb8c9

enable_audio_bell no
scrollback_lines 10000
linux_display_server auto

color0  #1b202a
color1  #ff7898
color2  #74dfb1
color3  #efc47c
color4  #8ab8f5
color5  #b6adf5
color6  #67dce5
color7  #d3dce9
color8  #8b98ac
color9  #ff9bb2
color10 #a1edcb
color11 #f6dba6
color12 #b1d0fa
color13 #d0cafa
color14 #a5ecf1
color15 #edf2f8
