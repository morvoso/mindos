# /etc/mindos/mindwm.toml — MindOS compositor defaults.
# Per-user overrides go in ~/.config/mindos/mindwm.toml (same keys).

[startup]
# Commands spawned once the Wayland socket is up; WAYLAND_DISPLAY and DISPLAY
# are set in their environment.
exec = ["/usr/lib/mindos/session-startup"]

[apps]
terminal = "kitty"

[mind]
socket = "/run/mindos/mind.sock"

[theme]
# MindOS dark desktop: charcoal, off-white text and the shared green accent.
# Red is reserved for the kernel/boot stages and never appears here.
background = "#080a0e"
foreground = "#edf2f8"
accent = "#3ddc97"
# Draw the MINDOS wordmark + shortcut hints until the shell's desktop is up.
show_wordmark = true
# The pointer: the MindOS cursor theme (animated dark glass, mindos-cursors)
# at a nominal 24 px. Settings > Desktop > Pointer changes it for the whole
# desktop (GSettings) and remembers it; these are only the defaults.
cursor_theme = "MindOS"
cursor_size = 24

[graphics]
# Whether a client's own buffer may go straight to the display hardware
# instead of being composed into the compositor's frame. Scanning out saves a
# copy and a frame of latency, which is what a game wants.
#   any      a fullscreen client's buffer goes to the plane whatever its
#            format, so an 8-bit game still scans out on a 10-bit display
#   matching only a buffer the plane already accepts, no format change
#   off      always compose
# An output whose display stops updating with a client buffer on the plane
# drops to "off" by itself for the rest of the session, and says so in the
# log. Set it here to make that permanent.
direct_scanout = "any"
