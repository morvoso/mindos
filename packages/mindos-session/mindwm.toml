# /etc/mindos/mindwm.toml — MindOS compositor defaults.
# Per-user overrides go in ~/.config/mindos/mindwm.toml (same keys).

[startup]
# Commands spawned once the Wayland socket is up; WAYLAND_DISPLAY and DISPLAY
# are set in their environment.
exec = ["/usr/lib/mindos/session-startup"]

[apps]
terminal = "foot"

[mind]
socket = "/run/mindos/mind.sock"

[theme]
# MindOS dark HUD: the void background, off-white text, one electric-cyan accent.
# Red is reserved for the kernel/boot stages and never appears here.
background = "#05070a"
foreground = "#e6edf3"
accent = "#19e3ff"
# Draw the MINDOS wordmark + shortcut hints until the shell's desktop is up.
show_wordmark = true
# The pointer: the MindOS cursor theme (animated dark glass, mindos-cursors)
# at a nominal 24 px. Settings > Desktop > Pointer changes it for the whole
# desktop (GSettings) and remembers it; these are only the defaults.
cursor_theme = "MindOS"
cursor_size = 24
