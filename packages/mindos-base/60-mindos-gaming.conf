# MindOS gaming/development kernel tuning. Every key here exists in the stock
# Arch kernel; an unknown key on another kernel only produces a warning.

# Proton/Wine games map a lot of memory; Steam recommends this.
vm.max_map_count = 2147483642
# zram-backed swap: no readahead. Swappiness is set by the performance mode
# (mindos-perf apply at boot: 30 balanced, 10 performance, 60 quiet).
vm.page-cluster = 0
# Bound dirty page cache so big writes do not stall the game.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
# Some games trigger split locks; the default mitigation freezes them for 10ms.
kernel.split_lock_mitigate = 0
# The NMI watchdog stays on. Gaming tunings routinely switch it off to free a
# PMU counter per CPU, and the CPU cost of leaving it on is not measurable in a
# frame time -- but it is the only thing in the system that can say anything at
# all about a hard lockup. Without it a wedged machine is a black screen and a
# journal that simply stops, with no trace of which CPU stopped or where. A
# distro that means to be stable has to be able to find out why it was not.
kernel.nmi_watchdog = 1
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 8192
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
