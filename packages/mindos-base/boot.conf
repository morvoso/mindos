# /etc/mindos/boot.conf — the MindOS boot menu (Limine). After a change run
# `sudo mindos-boot config`; kernel and snapshot updates re-run it themselves.

# Seconds the menu waits before booting MindOS. Every second here is a second
# of the boot; raise it if you pick entries from the menu often.
TIMEOUT=1

# Kernel command line. CMDLINE replaces the packaged line
# (/usr/share/mindos/kernel-cmdline) entirely; CMDLINE_EXTRA is appended to it.
# The nvidia_drm switches are dropped by themselves when no NVIDIA card is present.
#CMDLINE=""
CMDLINE_EXTRA=""

# nvidia_drm.fbdev=1 (in the packaged line) is what makes nvidia_drm do a full
# modeset on every connected display inside its probe -- most of the several
# seconds that probe takes on a multi-monitor machine. Since the drivers no
# longer load from the initramfs's modules-load.d, that probe runs in a udev
# worker beside the rest of the boot and no longer holds anything up, so there
# is little left to win here. Turning it off does still get the desktop up
# sooner, at the cost of the text consoles: with no nvidia fbdev, fbcon stays on
# the firmware framebuffer, which stops being scanned out the moment NVIDIA sets
# a mode -- so tty2, where MindOS puts anything that goes wrong, goes dark.
# To measure it for yourself, uncomment the line below and run
# `sudo mindos-boot config`; the packaged line is in
# /usr/share/mindos/kernel-cmdline.
#CMDLINE="quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 nvidia_drm.modeset=1 nvidia_drm.fbdev=0 amd_pstate=active zswap.enabled=0 preempt=full audit=0"

# Newest snapshots listed under "Snapshots" in the menu.
SNAPSHOT_ENTRIES=12

# Another operating system on this machine goes in /etc/mindos/boot.d/*.conf as
# Limine entries, which the menu copies in as they are — this file is rewritten
# on every kernel update, those are not. The surest form hands the other system
# to its own boot loader, which knows its kernels:
#
#   /Other system
#       comment: Boots its own loader.
#       protocol: efi
#       path: guid(<GUID of its EFI partition>):/EFI/<loader>/<loader>.efi
#
# `lsblk -o NAME,PARTUUID,PARTLABEL` names the partitions. After a change run
# `sudo mindos-boot config`.
