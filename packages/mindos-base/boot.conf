# /etc/mindos/boot.conf — the MindOS boot menu (Limine). After a change run
# `sudo mindos-boot config`; kernel and snapshot updates re-run it themselves.

# Seconds the menu waits before booting MindOS. Every second here is a second
# of the boot; raise it if you pick entries from the menu often.
TIMEOUT=1

# Kernel command line. CMDLINE replaces the packaged line
# (/usr/share/mindos/kernel-cmdline) entirely; CMDLINE_EXTRA is appended to it.
# The nvidia_drm switches are dropped by themselves when no NVIDIA card is present.
#CMDLINE=""
CMDLINE_EXTRA=""

# Newest snapshots listed under "Snapshots" in the menu.
SNAPSHOT_ENTRIES=12

# Another operating system on this machine goes in /etc/mindos/boot.d/*.conf as
# Limine entries, which the menu copies in as they are — this file is rewritten
# on every kernel update, those are not. The surest form hands the other system
# to its own boot loader, which knows its kernels:
#
#   /Other system
#       comment: Boots its own loader.
#       protocol: efi
#       path: guid(<GUID of its EFI partition>):/EFI/<loader>/<loader>.efi
#
# `lsblk -o NAME,PARTUUID,PARTLABEL` names the partitions. After a change run
# `sudo mindos-boot config`.
