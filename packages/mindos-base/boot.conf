# /etc/mindos/boot.conf — the MindOS boot menu (Limine). After a change run
# `sudo mindos-boot config`; kernel and snapshot updates re-run it themselves.

# Seconds the menu waits before booting MindOS.
TIMEOUT=3

# Kernel command line. CMDLINE replaces the packaged line
# (/usr/share/mindos/kernel-cmdline) entirely; CMDLINE_EXTRA is appended to it.
# The nvidia_drm switches are dropped by themselves when no NVIDIA card is present.
#CMDLINE=""
CMDLINE_EXTRA=""

# Newest snapshots listed under "Snapshots" in the menu.
SNAPSHOT_ENTRIES=12
