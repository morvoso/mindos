# MindOS initramfs: systemd-based early boot with Plymouth and early KMS.
# sd-volatile lets a snapshot boot with its changes kept in RAM
# (systemd.volatile=overlay on the snapshot entries of the boot menu).
# The installer drops this at /etc/mkinitcpio.conf.d/mindos.conf and trims
# MINDOS_GPU_MODULES to the GPUs actually present.
#
# MODULES is empty on purpose, and the display drivers go in MINDOS_GPU_MODULES
# instead. Both put a module in the image, but MODULES also writes it into
# /etc/modules-load.d/MODULES.conf, where systemd-modules-load loads them one at
# a time with initrd.target ordered after the lot -- which stops the boot dead
# for as long as the slowest GPU probe takes (4.4s for nvidia_drm on a
# two-display machine, with the root filesystem already mounted and waiting).
# The mindos-gpu hook adds them without that file, so udev coldplug loads them
# in its worker pool, in parallel, with nothing ordered after them. See
# usr/lib/initcpio/install/mindos-gpu.
#
# MINDOS_GPU_MODULES carries the graphics drivers, so the kms hook is
# deliberately absent. kms adds every DRM driver that matches the hardware,
# which on an NVIDIA card means nouveau as well as the driver in use -- and with
# it every generation of nouveau firmware (over 200 MiB, uncompressed, in the
# early CPIO) for a module that nvidia-utils blacklists and the system will
# never load. mkinitcpio does not read modprobe blacklists. install-gpu.py lists
# every bound display driver, so a Mesa/Nouveau, Intel or AMD machine still gets
# its driver here.
#
# nvidia_uvm is deliberately not in that list: it is the CUDA unified-memory
# driver, nothing in early boot opens it, and nvidia-utils' 60-nvidia.rules runs
# `nvidia-modprobe -c0 -u` to load it on demand for the first CUDA context.
MODULES=()
MINDOS_GPU_MODULES=(nvidia nvidia_modeset nvidia_drm amdgpu)
HOOKS=(base systemd plymouth mindos-gpu autodetect microcode modconf keyboard sd-vconsole block filesystems fsck sd-volatile)
COMPRESSION="zstd"
