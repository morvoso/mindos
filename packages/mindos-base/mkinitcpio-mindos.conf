# MindOS initramfs: systemd-based early boot with Plymouth and early KMS.
# sd-volatile lets a snapshot boot with its changes kept in RAM
# (systemd.volatile=overlay on the snapshot entries of the boot menu).
# The installer drops this at /etc/mkinitcpio.conf.d/mindos.conf and trims
# MODULES to the GPUs actually present.
#
# MODULES carries the graphics drivers, so the kms hook is deliberately absent.
# kms adds every DRM driver that matches the hardware, which on an NVIDIA card
# means nouveau as well as the driver in use — and with it every generation of
# nouveau firmware (over 200 MiB, uncompressed, in the early CPIO) for a module
# that nvidia-utils blacklists and the system will never load. mkinitcpio does
# not read modprobe blacklists. install-gpu.py lists every bound display driver,
# so a Mesa/Nouveau, Intel or AMD machine still gets its driver here.
MODULES=(nvidia nvidia_modeset nvidia_uvm nvidia_drm amdgpu)
HOOKS=(base systemd plymouth autodetect microcode modconf keyboard sd-vconsole block filesystems fsck sd-volatile)
COMPRESSION="zstd"
