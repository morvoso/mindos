# /etc/mindos/perf.conf — MindOS performance modes (see mindos-perf modes).

# Mode while a game runs (GameMode hooks): performance | balanced | quiet,
# or empty to leave the current mode alone.
GAME_MODE=performance

# Unload the Mind's language model from the GPU while a game runs (1/0).
MIND_SLEEPS_WHILE_GAMING=1

# sched_ext scheduler used in performance mode (scx-scheds); empty = keep EEVDF+BORE.
SCX_SCHEDULER=scx_lavd
SCX_ARGS=""

# NVIDIA power limit in performance mode: default | max | <watts>.
NVIDIA_POWER_LIMIT=default
