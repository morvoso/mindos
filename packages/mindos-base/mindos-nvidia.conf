# MindOS NVIDIA defaults: KMS + fbdev for the compositor and the boot splash,
# video memory preserved across suspend by the current open driver's kernel
# suspend notifiers. Do not force the older procfs/service-only mechanism.
options nvidia_drm modeset=1 fbdev=1
options nvidia NVreg_UseKernelSuspendNotifiers=1 NVreg_TemporaryFilePath=/var/tmp
