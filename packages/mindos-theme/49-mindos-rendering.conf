<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  MindOS text rendering defaults.

  These reproduce the way macOS rasterises text, which is what the compositor's
  own software renderer (mindwm/src/text.rs) already does for the Mind bar and
  the window titles:

    * Antialiasing on, in grayscale. Subpixel (LCD/RGB) antialiasing tints
      glyph edges red and blue; it buys a little sharpness on a 96 dpi LCD and
      costs colour fringing everywhere else — on rotated panels, on OLED
      layouts that are not RGB stripe, and in every screenshot or screen share.
      macOS dropped it in 10.14 and so does MindOS.
    * Slight hinting with the v40 TrueType interpreter (FreeType's default).
      Glyphs are snapped vertically so horizontal stems stay crisp, and left
      alone horizontally so letter shapes and spacing keep the proportions the
      face was drawn with instead of being distorted onto the pixel grid.
    * No autohinter and no embedded bitmaps: both override the outlines the
      designer drew.

  Numbered 49 so it lands after fontconfig's own rendering defaults (10-*, 11-*)
  and still before 50-user.conf, which means anything in ~/.config/fontconfig
  continues to win.
-->
<fontconfig>
  <match target="font">
    <edit name="antialias"      mode="assign"><bool>true</bool></edit>
    <edit name="rgba"           mode="assign"><const>none</const></edit>
    <edit name="lcdfilter"      mode="assign"><const>lcdnone</const></edit>
    <edit name="hinting"        mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle"      mode="assign"><const>hintslight</const></edit>
    <edit name="autohint"       mode="assign"><bool>false</bool></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
