# MindOS boot menu: white on MindOS red (#8c1010), the same look as the kernel
# console that follows. `mindos-boot config` copies these lines into
# /boot/limine.conf.
interface_branding: MindOS
interface_branding_colour: ffffff
interface_help_hidden: yes
interface_help_colour: ffffff
interface_help_colour_bright: ffffff
term_background: 008c1010
term_foreground: ffffff
term_background_bright: ffffff
term_foreground_bright: 8c1010
term_palette: 8c1010;ffffff;ffffff;ffffff;ffffff;ffffff;ffffff;ffffff
term_palette_bright: b03030;ffffff;ffffff;ffffff;ffffff;ffffff;ffffff;ffffff
