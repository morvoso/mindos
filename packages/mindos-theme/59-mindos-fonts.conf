<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  MindOS font families.

  Inter is the system face: it was drawn for user interfaces at small sizes,
  with a tall x-height and open apertures, which is what keeps 12-14 px labels
  legible. JetBrains Mono is the monospace face and matches the terminal
  (/etc/xdg/kitty/kitty.conf). Orbitron stays a display face and is asked
  for by name, never through an alias.

  Numbered 59, ahead of 60-latin.conf: an <alias><prefer> inserts its families
  immediately before the generic name it matched, so whichever file runs first
  ends up at the head of the list. At 61 these preferences would land *behind*
  the stock Noto/DejaVu defaults and never be picked.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>DejaVu Serif</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>

  <!-- The CSS/UI generics. fontconfig 2.15+ tags these on the pattern as
       `genericfamily` (48-guessfamily.conf), but 49-sansserif.conf only turns
       serif, sans-serif, monospace, emoji and math back into a family name.
       `ui-sans-serif`, `ui-monospace` and `ui-serif` survive only because
       48-guessfamily matches on substrings, and `system-ui` matches nothing at
       all — left alone it resolves to whatever font happens to sort first.
       So the mapping is spelled out here against `genericfamily`. -->
  <match target="pattern">
    <test name="genericfamily" compare="contains"><const>system-ui</const></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="genericfamily" compare="contains"><const>ui-sans-serif</const></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="genericfamily" compare="contains"><const>ui-rounded</const></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="genericfamily" compare="contains"><const>ui-monospace</const></test>
    <edit name="family" mode="prepend" binding="strong"><string>JetBrains Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="genericfamily" compare="contains"><const>ui-serif</const></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif</string></edit>
  </match>

  <!-- The names GTK, Qt, Electron and web content ask for by hand when they
       want "the system UI font" or "the system terminal font". -->
  <alias binding="same"><family>-apple-system</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>BlinkMacSystemFont</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro Text</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro Display</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Cantarell</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Ubuntu</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Mono</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="same"><family>Menlo</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="same"><family>Consolas</family><prefer><family>JetBrains Mono</family></prefer></alias>

  <!-- Every family falls back to Noto for scripts it does not cover, then to
       colour emoji, so no application ends up drawing boxes. -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak"><string>Noto Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Noto Color Emoji</string></edit>
  </match>
</fontconfig>
