# MindOS developer tuning (mindos-dev). Values apply at boot; `sudo sysctl --system`
# re-applies them. Override in /etc/sysctl.d/ with a higher-numbered file.

# Editors, bundlers and test runners watch whole source trees; the kernel
# default (8192 files per user) runs out on any medium-sized monorepo.
fs.inotify.max_user_watches = 1048576

# Each watcher (VS Code, vite, cargo watch, syncthing, ...) needs an inotify
# instance; the default 128 is reached with a few dev servers open.
fs.inotify.max_user_instances = 1024

# Let unprivileged users profile their own processes with perf (CPU and
# software events, no kernel samples). 2 is the kernel default; -1 would
# expose kernel profiling to everyone.
kernel.perf_event_paranoid = 1

# kernel.kptr_restrict stays at its default (1): perf works without kernel
# symbol addresses, and hiding them from unprivileged users is worth keeping.
