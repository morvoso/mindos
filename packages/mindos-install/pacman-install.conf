#
# /etc/pacman.conf for MindOS (used by mindos-install for pacstrap and
# installed on the target). The [mindos] repository comes first so MindOS
# packages win over same-named Arch packages.
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 8
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[mindos]
SigLevel = Optional TrustAll
Server = file:///var/lib/mindos/repo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
