# /etc/mindos/mind.toml — configuration of the MindOS Mind daemon (mindd).
# Every key is optional; the values below are the defaults.

[model]
# GGUF file to serve, or "auto": default.gguf in models_dir, else the largest
# GGUF that fits in ~80% of GPU memory. MindOS ships Qwen3.5 2B (Apache-2.0);
# Settings › Mind switches models and downloads others from the catalog, and
# its choice is kept in <state_dir>/mind-prefs.json, which overrides this.
path = "auto"
models_dir = "/var/lib/mindos/models"
context = 8192
# -1 = offload every layer to the GPU, 0 = CPU only.
gpu_layers = -1
# 0 = let llama-server pick the thread count.
threads = 0
llama_server = "/usr/bin/llama-server"
host = "127.0.0.1"
port = 8642
extra_args = []
temperature = 0.3
max_tokens = 2048
# Let the model reason before answering (Qwen3 "thinking"). Slower; off by
# default. Settings › Mind or `mind thinking on` toggles it at runtime.
thinking = false
# Models the Settings app offers to download (a JSON array).
catalog = "/etc/mindos/model-catalog.json"
# Point at an already running OpenAI-compatible server instead of spawning one:
# external_url = "http://127.0.0.1:11434/v1"

[daemon]
socket = "/run/mindos/mind.sock"
log = "/var/log/mindos/mind.jsonl"
state_dir = "/var/lib/mindos"
# Members of this group may talk to the Mind (the socket is 660 root:group).
group = "mindos"
max_tool_rounds = 16
tool_timeout_secs = 1800

[policy]
# true: run every state-changing tool without asking first.
autopilot = false
# Tool categories that never need confirmation, e.g. ["update"].
autopilot_categories = []
# Extra read-only commands allowed through run_command without confirmation.
extra_observe_commands = []

[updates]
# The update watcher: checks the repositories and Arch news this often
# (hours; 0 = off), rates the pending updates (rules + the model) and posts a
# notice. Every pacman run is recorded and the health checks verify the
# system afterwards, pointing at the pre-update snapshot if something broke.
check_interval_hours = 6
assess = true
# Install updates the assessment rates "low" risk without asking. Settings ›
# Updates toggles this at runtime (mind-prefs.json overrides this value).
auto_apply = false
# Health checks (failed services, drivers, disks, pacnew) every N minutes; 0 = off.
health_interval_mins = 30

[web]
# The Mind can look things up on the internet: web_search, web_fetch,
# arch_wiki, wikipedia, protondb, download_file and open_url. Everything goes
# out through curl, GET only, with the redirects checked one at a time.
enabled = true
# Any engine works; {query} is where the words go. An HTML page is scraped, a
# SearXNG-style JSON answer is read directly.
search_url = "https://html.duckduckgo.com/html/?q={query}"
user_agent = "Mozilla/5.0 (X11; Linux x86_64) MindOS-Mind/1.0"
timeout_secs = 25
# How much of a page is read (bytes) and how many redirects are followed.
max_bytes = 400000
max_redirects = 5
# Off: this machine and the local network are out of reach, so nothing the
# Mind reads online can make it call a service on your own network. Turn it
# on only if you want the Mind to fetch from your LAN.
allow_private = false
# Hosts the Mind must never fetch; a bare domain covers its subdomains.
deny_hosts = []
# Downloads: how long one may take and how large it may be.
download_timeout_secs = 900
max_download_bytes = 4000000000
