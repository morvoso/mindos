# /etc/mindos/pkg.conf: package sources permitted to mindos-pkg.
#
# mindos-pkg installs from the MindOS and Arch repositories first, then from
# Flathub. Packages from both sources are built and signed before they are
# distributed.
#
# The AUR (Arch User Repository) is different. Its packages are submitted by
# users and are not reviewed, and their build scripts run on this system
# during installation. Because of this, the AUR is disabled by default.
# Neither the Mind nor the Settings app will enable it.
#
# aur = yes    permit `mindos-pkg install NAME` to fall back to the AUR
# aur = no     repositories and Flathub only (default)
#
# `mindos-pkg install --aur NAME` permits the AUR for a single command without
# changing this file. `mindos-pkg search NAME` always lists AUR results.
aur = no
