# /etc/mindos/pkg.conf: package sources permitted to mindos-pkg.
#
# mindos-pkg installs from the MindOS and Arch repositories first, then from
# Flathub. Packages from both sources are built and signed before they are
# distributed.
#
# The AUR (Arch User Repository) comes last, and only for packages that are in
# neither of the above — google-chrome and a good many game and driver tools
# live there and nowhere else. Its packages are submitted by users and are not
# reviewed, and their build scripts run on this system during installation,
# so every AUR build the Mind starts is shown to you for confirmation first.
#
# aur = yes    fall back to the AUR when nothing else has the package (default)
# aur = no     repositories and Flathub only
#
# `mindos-pkg install --no-aur NAME` skips the AUR for a single command, and
# `--aur` forces it on. Settings › Mind has the same switch for the Mind.
aur = yes
