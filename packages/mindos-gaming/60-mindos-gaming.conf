# MindOS: Steam/Proton and the compositor open many files.
* hard nofile 1048576
* soft nofile 1048576
# GameMode's packaged rule targets @gamemode, but MindOS desktop accounts
# belong to @mindos. Allow the configured renice=10 in their PAM sessions,
# and one step beyond it for the compositor: mindwm puts its event loop at
# nice -11 (mindwm/src/sched.rs), so the display server stays ahead of the
# game it is drawing instead of competing with it for a turn.
@mindos - nice -11
