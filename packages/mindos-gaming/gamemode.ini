; /etc/gamemode.ini — MindOS GameMode defaults.
[general]
reaper_freq=5
desiredgov=performance
; Restore the original governor before the end hook reapplies the user's mode.
; Do not override defaultgov: mindos-perf owns the persistent preference.
; The kernel uses EEVDF/BORE or sched_ext, neither supports SCHED_ISO.
softrealtime=off
; mindos-perf owns CPU policy; don't change it again from the reaper thread.
igpu_power_threshold=-1
renice=10
ioprio=0
inhibit_screensaver=1
disable_splitlock=1

[filter]
[gpu]
apply_gpu_optimisations=0

[custom]
; MindOS: performance mode (and a sleeping Mind) while a game runs — see mindos-perf.
start=/usr/bin/sudo -n /usr/bin/mindos-perf game-start
end=/usr/bin/sudo -n /usr/bin/mindos-perf game-end
