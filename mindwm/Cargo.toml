[package]
name = "mindwm"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-MindOS"
description = "The MindOS compositor (Wayland + XWayland, DRM/KMS), derived from Smithay's anvil"
publish = false

[dependencies]
bitflags = "2"
rand = "0.8"
tracing = { version = "0.1", features = ["max_level_trace", "release_max_level_debug"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
xcursor = "0.3"
xkbcommon = "0.8"
smithay-drm-extras = { version = "0.1", default-features = false }
profiling = "1.0"
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
libc = "0.2"
freedesktop-icons = "0.4"
gdk-pixbuf = "0.22"
wayland-protocols-wlr = { version = "0.3", features = ["server"] }

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
  "desktop", "wayland_frontend", "use_system_lib", "backend_egl",
  "backend_libinput", "backend_udev", "backend_drm", "backend_gbm", "backend_vulkan",
  "backend_session_libseat", "renderer_gl", "renderer_pixman", "renderer_multi",
  "backend_winit", "xwayland", "x11rb_event_source",
]

[dependencies.x11rb]
version = "0.13"
default-features = false
features = ["composite", "xtest"]

# The integration tests (tests/headless) run the compositor with no GPU and
# talk to it the way programs do: over Wayland and the shell's IPC socket.
[dev-dependencies]
tempfile = "3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[features]
default = ["egl", "winit", "udev", "xwayland"]
egl = []
winit = []
udev = []
xwayland = []
renderer_sync = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1

# smithay 0.7.0 with an XWM backport: _NET_ACTIVE_WINDOW names the focused
# window, clients may ask for it, and _NET_WM_STATE set before mapping counts.
# See vendor/smithay/MINDOS-PATCHES.md.
[patch.crates-io]
smithay = { path = "vendor/smithay" }
