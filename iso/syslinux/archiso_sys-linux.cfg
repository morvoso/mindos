LABEL mindos
TEXT HELP
Boot the MindOS live system (BIOS). Install it with: sudo mindos-install
ENDTEXT
MENU LABEL MindOS Live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-mindos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-mindos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 vt.global_cursor_default=0 nvidia_drm.modeset=1 nvidia_drm.fbdev=1

LABEL mindos-verbose
TEXT HELP
Boot MindOS with the full kernel and systemd console output.
ENDTEXT
MENU LABEL MindOS Live, ^verbose console (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-mindos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-mindos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nvidia_drm.modeset=1 nvidia_drm.fbdev=1

LABEL mindos-safe
TEXT HELP
Boot MindOS without kernel mode setting (fallback graphics).
ENDTEXT
MENU LABEL MindOS Live, ^safe graphics (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-mindos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-mindos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset
