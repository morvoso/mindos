# pacman.conf used by mkarchiso while building the MindOS ISO (inside the build box).
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 8
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[mindos]
SigLevel = Optional TrustAll
Server = file:///work/build/repo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
